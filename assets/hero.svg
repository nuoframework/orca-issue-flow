<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="orca-issue-flow — one issue, critical specialists, two gates you control">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.6" stop-color="#0b1224"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="20" fill="url(#grid)" opacity="0.55"/>
  <ellipse cx="950" cy="170" rx="340" ry="220" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="20" fill="none" stroke="#1e293b"/>

  <circle cx="76" cy="76" r="5" fill="#34d399"/>
  <text x="96" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="44" font-weight="700" letter-spacing="-1">
    <tspan fill="#34d399">orca</tspan><tspan fill="#475569">-</tspan><tspan fill="#ffffff">issue</tspan><tspan fill="#475569">-</tspan><tspan fill="#ffffff">flow</tspan>
  </text>
  <text x="98" y="136" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" fill="#94a3b8">One issue. Critical review. Two gates you control.</text>
  <text x="98" y="184" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#7d8da1">A multi-agent workflow that takes an issue from brief to pull request inside Orca —</text>
  <text x="98" y="208" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#7d8da1">and stops, twice, to ask you.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <rect x="98" y="240" width="238" height="32" rx="8" fill="rgba(15,23,42,0.5)" stroke="#334155"/>
    <text x="114" y="261" fill="#475569">$</text>
    <text x="132" y="261" fill="#e2e8f0">npx orca-issue-flow</text>
  </g>

  <!-- pipeline motif: two independent plans, merged, then two gates only you can open -->
  <g transform="translate(760, 66)">
    <g fill="none" stroke="#64748b" stroke-width="2">
      <path d="M14 44 H108"/>
      <path d="M14 148 H108"/>
      <path d="M108 44 C148 44 146 96 186 96"/>
      <path d="M108 148 C148 148 146 96 186 96"/>
      <path d="M226 96 H278"/>
      <path d="M300 96 H370"/>
    </g>
    <path d="M392 96 H452" fill="none" stroke="#34d399" stroke-width="2"/>
    <path d="M462 96 l-11 -7 v14 z" fill="#34d399"/>

    <circle cx="14" cy="44" r="9" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="2"/>
    <circle cx="14" cy="148" r="9" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="2"/>
    <circle cx="206" cy="96" r="11" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="2"/>

    <rect x="278" y="62" width="22" height="68" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="2"/>
    <rect x="370" y="62" width="22" height="68" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="2"/>

    <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#7d8da1">
      <text x="-2" y="26">plan A</text>
      <text x="-2" y="176">plan B</text>
      <text x="184" y="132" fill="#94a3b8">judge</text>
    </g>
    <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#fb7185" text-anchor="middle">
      <text x="289" y="52">you</text>
      <text x="381" y="52">you</text>
    </g>
  </g>
</svg>
